[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

build_flags =
    -D WIFI_SSID=\"NomeDaSuaRedeReal\"
    -D WIFI_PASS=\"SuaSenhaRealAqui\"

lib_deps = 
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bblanchon/ArduinoJson @ ^6.21.3