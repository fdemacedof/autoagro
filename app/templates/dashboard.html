<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Kampu | Dashboard Estufa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --kampu-green: #2d6a4f; --kampu-dark: #1b4332; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: white; border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        .sensor-val { font-size: 2.5rem; font-weight: bold; color: var(--kampu-dark); }
        .live-indicator { width: 12px; height: 12px; background: #dc3545; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .btn-modo.active { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">🌿 KAMPU <small class="fw-light">| Monitoramento Vivo</small></span>
        <a href="/ia" class="btn btn-outline-success btn-sm">Abrir IA Vision</a>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card glass-card h-100 p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0"><i class="bi bi-camera-video"></i> Estufa Interna</h5>
                    <span class="badge bg-light text-dark"><span class="live-indicator me-1"></span> AO VIVO</span>
                </div>
                <img src="/video_feed" class="img-fluid rounded-3 w-100" style="object-fit: cover; max-height: 500px;" alt="Feed ao vivo da Estufa">
            </div>
        </div>

        <div class="col-lg-4">
            <div class="row g-3">
                <div class="col-12">
                    <div class="card glass-card p-4 text-center">
                        <small class="text-muted text-uppercase fw-bold">Temperatura</small>
                        <div class="sensor-val" id="temp-val">--°C</div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card glass-card p-4 text-center">
                        <small class="text-muted text-uppercase fw-bold">Umidade do Ar</small>
                        <div class="sensor-val" id="umi-val">--%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card glass-card p-3">
                <div class="d-flex flex-row align-items-center justify-content-between mb-3">
                    <div>
                        <i class="bi bi-water text-primary fs-4 me-2"></i>
                        <strong>Umidificador:</strong>
                        <span id="h-status" class="badge bg-secondary">OFF</span>
                        <span id="h-modo" class="badge bg-light text-dark border ms-1">automático</span>
                    </div>
                    <small class="text-muted">Última atualização: <span id="update-time">--:--</span></small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-success btn-modo" id="btn-on" onclick="setRele('on')">
                        <i class="bi bi-play-fill"></i> Ligar
                    </button>
                    <button class="btn btn-outline-danger btn-modo" id="btn-off" onclick="setRele('off')">
                        <i class="bi bi-stop-fill"></i> Desligar
                    </button>
                    <button class="btn btn-outline-secondary btn-modo" id="btn-auto" onclick="setRele('auto')">
                        <i class="bi bi-arrow-repeat"></i> Automático
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateDashboard() {
        fetch('/api/clima')
            .then(r => r.json())
            .then(data => {
                document.getElementById('temp-val').innerText = data.temperatura;
                document.getElementById('umi-val').innerText = data.umidade;
                document.getElementById('update-time').innerText = data.ultimo_update;

                const hStatus = document.getElementById('h-status');
                hStatus.innerText = data.umidificador;
                hStatus.className = data.umidificador === "ON" ? "badge bg-success" : "badge bg-secondary";

                const hModo = document.getElementById('h-modo');
                const modo = data.modo_rele || "automatico";
                hModo.innerText = modo === "manual" ? "manual" : "automático";

                // Destaca visualmente o botão de modo ativo
                document.getElementById('btn-auto').classList.toggle('active', modo !== "manual");
                document.getElementById('btn-on').classList.toggle('active', modo === "manual" && data.umidificador === "ON");
                document.getElementById('btn-off').classList.toggle('active', modo === "manual" && data.umidificador === "OFF");
            });
    }

    function setRele(comando) {
        fetch(`/api/rele/${comando}`, { method: 'POST' })
            .then(r => r.json())
            .then(() => updateDashboard())
            .catch(err => console.error("Erro ao enviar comando do relé:", err));
    }

    setInterval(updateDashboard, 2000);
    updateDashboard();
</script>
</body>
</html>
